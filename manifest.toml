#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "livekit"
name = "LiveKit"
description.en = "Real-time video, audio and data for developers"
description.fr = "Real-time video, audio and data for developers"

version = "1.8.4~ynh0"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://livekit.io/"
demo = "https://cloud.livekit.io/"
code = "https://github.com/livekit/livekit"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.default_home_server]
    ask.en = "Choose a default Matrix server"
    ask.fr = "Choisissez un serveur Matrix par défault"
    type = "string"
    example = "my-own-homeserver.tld"
    default = "matrix.org"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/livekit/livekit/archive/refs/tags/v1.8.4.tar.gz"
    sha256 = "81e8b7c6ed90fe98f91bb0b1dd48bf254f564f3cc925ce5d25e335e2e03fd648"
    
    autoupdate.strategy = "latest_github_tag"
    
    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = ""
